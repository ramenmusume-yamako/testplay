    <!-- デバッグモード起動JavaScript -->
    <script>
  let headerTaps = 0;
  let footerTaps = 0;
  let resetTimer = null;

  // 🔒 デバッグモード解除用のパスワード（好きな文字列に変更できます）
  const DEBUG_PASSWORD = "pW3$zR9!mK";

  function checkDebugUnlock() {
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => {
      headerTaps = 0;
      footerTaps = 0;
    }, 5000);

    // ヘッダーとフッターがそれぞれ5回以上タップされたら処理を実行
    if (headerTaps >= 5 && footerTaps >= 5) {
      // 連続発動を防ぐためにタップ数をリセット
      headerTaps = 0;
      footerTaps = 0;

      // パスワード入力ダイアログを表示
      const inputPassword = prompt('🔒 デバッグモードのパスワードを入力してください:');

      if (inputPassword === DEBUG_PASSWORD) {
    localStorage.setItem('debug_mode', 'true');
    alert('🔓 デバッグモードを開始しました。');
    window.location.href = 'debug.html';
      } else if (inputPassword !== null) {
        // キャンセルボタン以外が押されてパスワードが違った場合
        alert('❌ パスワードが違います。');
      }
    }
  }

  // タップイベント登録用の共通関数（PCのclickとスマホのtouchstart両対応）
  function attachSecretTapEvent(element, tapCallback) {
    if (!element) return;

    // スマホ用のタッチイベント
    element.addEventListener('touchstart', (e) => {
      e.preventDefault(); 
      tapCallback();
    }, { passive: false });

    // PCのマウスクリック用
    element.addEventListener('click', () => {
      tapCallback();
    });
  }

  // 看板画像とフッターへイベント登録
  attachSecretTapEvent(document.getElementById('header-img'), () => {
    headerTaps++;
    checkDebugUnlock();
  });

  attachSecretTapEvent(document.getElementById('footer-copyright'), () => {
    footerTaps++;
    checkDebugUnlock();
  });
</script>

<!-- PVカウント用スクリプト (Firebase連動) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore,
    doc,
    setDoc,
    increment,
    collection,
    query,
    orderBy,
    limit,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD5HT-oNq3hFOLSpBqG19Vw7ZmmaEHPzSY",
    authDomain: "ramengirls-bd769.firebaseapp.com",
    projectId: "ramengirls-bd769",
    storageBucket: "ramengirls-bd769.firebasestorage.app",
    messagingSenderId: "211447953783",
    appId: "1:211447953783:web:3d3ee33f78e0d830f48972"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const categoryLabels = {
    'label-menu': '新メニュー',
    'label-shop': 'お店情報',
    'label-girls': 'ラーメン娘',
    'label-sonota': 'その他'
};

function loadLatestNews() {
    const newsList = document.getElementById('home-news-list');
    if (!newsList) return;

    const newsQuery = query(
        collection(db, "news"),
        orderBy("createdAt", "desc"),
        limit(3)
    );

    onSnapshot(newsQuery, (snapshot) => {
        if (snapshot.empty) {
            newsList.innerHTML = '<li class="home-news-empty">現在、お知らせはありません。</li>';
            return;
        }

        newsList.innerHTML = '';

        snapshot.forEach((docSnap) => {
            const item = docSnap.data();

            const newsItem = document.createElement('li');
            newsItem.className = 'home-news-item';

            const newsLink = document.createElement('a');
            newsLink.href = 'news.html';
            newsLink.className = 'home-news-link';

            const meta = document.createElement('div');
            meta.className = 'home-news-meta';

            const date = document.createElement('span');
            date.className = 'home-news-date';
            date.textContent = item.date || '';

            const label = document.createElement('span');
            label.className = `home-news-label ${item.category || ''}`;
            label.textContent =
                item.categoryName ||
                categoryLabels[item.category] ||
                'お知らせ';

            meta.appendChild(date);
            meta.appendChild(label);

            const content = document.createElement('div');
            content.className = 'home-news-content';

            const title = document.createElement('h3');
            title.className = 'home-news-item-title';
            title.textContent = item.title || '';

            content.appendChild(title);

            if (item.titleImg) {
                const imgWrap = document.createElement('div');
                imgWrap.className = 'home-news-title-img-wrap';

                const img = document.createElement('img');
                img.src = item.titleImg;
                img.alt = item.title || 'お知らせ画像';
                img.className = 'home-news-title-img';

                imgWrap.appendChild(img);
                content.appendChild(imgWrap);
            }

            const toggle = document.createElement('span');
            toggle.className = 'home-news-toggle';
            toggle.textContent = 'クリックで詳細を表示 🔍';

            content.appendChild(toggle);

            newsLink.appendChild(meta);
            newsLink.appendChild(content);
            newsItem.appendChild(newsLink);
            newsList.appendChild(newsItem);
        });
    }, (error) => {
        console.error('お知らせ取得エラー:', error);
        newsList.innerHTML =
            '<li class="home-news-empty">お知らせを取得できませんでした。</li>';
    });
}

loadLatestNews();

  (async function trackPV() {
    // セッション（タブを開いてから閉じるまで）で1回だけカウント
    if (!sessionStorage.getItem('visited_session')) {
      const today = new Date().toISOString().split('T')[0];
      const pvRef = doc(db, "pv", today);

      try {
        // 今日のドキュメントの count を +1（無ければ自動作成）
        await setDoc(pvRef, { count: increment(1) }, { merge: true });
        sessionStorage.setItem('visited_session', 'true');
      } catch (e) {
        console.error("PVカウントエラー:", e);
      }
    }
  })();
</script>
