<script>
let headerTaps = 0;
let footerTaps = 0;
let resetTimer = null;
const DEBUG_PASSWORD = "pW3$zR9!mK";

function updateDebugMenu() {
    const debugMenuItem = document.getElementById('debug-menu-item');
    if (!debugMenuItem) return;
    if (localStorage.getItem('debug_mode') === 'true') {
        debugMenuItem.style.display = 'block';
    } else {
        debugMenuItem.style.display = 'none';
    }
}

function checkDebugUnlock() {
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => {
        headerTaps = 0;
        footerTaps = 0;
    }, 5000);

    if (headerTaps >= 5 && footerTaps >= 5) {
        headerTaps = 0;
        footerTaps = 0;

        const inputPassword = prompt('🔒 デバッグモードのパスワードを入力してください:');

        if (inputPassword === DEBUG_PASSWORD) {
            localStorage.setItem('debug_mode', 'true');
            alert('🔓 認証成功！ハンバーガーメニューにデバッグページが追加されました。');
            updateDebugMenu();
        } else if (inputPassword !== null) {
            alert('❌ パスワードが違います。');
        }
    }
}

function attachSecretTapEvent(element, tapCallback) {
    if (!element) return;

    element.addEventListener('touchstart', (e) => {
        e.preventDefault();
        tapCallback();
    }, { passive: false });

    element.addEventListener('click', () => {
        tapCallback();
    });
}

attachSecretTapEvent(document.getElementById('header-img'), () => {
    headerTaps++;
    checkDebugUnlock();
});

attachSecretTapEvent(document.getElementById('footer-copyright'), () => {
    footerTaps++;
    checkDebugUnlock();
});

document.addEventListener('DOMContentLoaded', updateDebugMenu);
</script>

    messagingSenderId: "211447953783",
    appId: "1:211447953783:web:3d3ee33f78e0d830f48972"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

(async function trackPV() {
    if (!sessionStorage.getItem('visited_session')) {
        const today = new Date().toISOString().split('T')[0];
        const pvRef = doc(db, "pv", today);

        try {
            await setDoc(pvRef, { count: increment(1) }, { merge: true });
            sessionStorage.setItem('visited_session', 'true');
        } catch (e) {
            console.error("PVカウントエラー:", e);
        }
    }
})();
</script>
