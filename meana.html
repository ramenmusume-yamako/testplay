    <!-- PVカウント用スクリプト (Firebase連動) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD5HT-oNq3hFOLSpBqG19Vw7ZmmaEHPzSY",
    authDomain: "ramengirls-bd769.firebaseapp.com",
    projectId: "ramengirls-bd769",
    storageBucket: "ramengirls-bd769.firebasestorage.app",
    messagingSenderId: "211447953783",
    appId: "1:211447953783:web:3d3ee33f78e0d830f48972"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  (async function trackPV() {
    // セッション（タブを開いてから閉じるまで）で1回だけカウント
    if (!sessionStorage.getItem('visited_session')) {
      const today = new Date().toISOString().split('T')[0];
      const pvRef = doc(db, "pv", today);

      try {
        // 今日のドキュメントの count を +1（無ければ自動作成）
        await setDoc(pvRef, { count: increment(1) }, { merge: true });
        sessionStorage.setItem('visited_session', 'true');
      } catch (e) {
        console.error("PVカウントエラー:", e);
      }
    }
  })();
</script>

<script>
    if (window.innerWidth <= 768) {

        const photoTrack = document.querySelector('.shop-photo-track');
        const photoSlides = document.querySelectorAll('.shop-photo-slide');

        let currentPhoto = 0;

        // 自動スライド用タイマー
        let autoSlideTimer;

        // 写真を表示する
        function showPhoto(index) {
            currentPhoto = index;

            photoTrack.style.transform =
                `translateX(-${currentPhoto * 100}%)`;
        }

        // 3秒後に自動スライドを開始する
        function startAutoSlide() {
            clearTimeout(autoSlideTimer);

            autoSlideTimer = setTimeout(function() {
                nextPhoto();
            }, 3000);
        }

        // 次の写真へ
        function nextPhoto() {
            currentPhoto++;

            if (currentPhoto >= photoSlides.length) {
                currentPhoto = 0;
            }

            showPhoto(currentPhoto);

            // 自動スライド後も3秒待つ
            startAutoSlide();
        }

        // 最初の自動スライド
        startAutoSlide();


        // =========================
        // スワイプ操作
        // =========================

        let touchStartX = 0;
        let touchEndX = 0;

        photoTrack.addEventListener('touchstart', function(event) {
            touchStartX = event.touches[0].clientX;

            // スワイプした瞬間に自動スライドのタイマーをリセット
            clearTimeout(autoSlideTimer);
        });

        photoTrack.addEventListener('touchend', function(event) {

            touchEndX = event.changedTouches[0].clientX;

            const difference = touchStartX - touchEndX;

            // 左スワイプ
            if (difference > 50) {

                currentPhoto++;

                if (currentPhoto >= photoSlides.length) {
                    currentPhoto = 0;
                }

                showPhoto(currentPhoto);
            }

            // 右スワイプ
            else if (difference < -50) {

                currentPhoto--;

                if (currentPhoto < 0) {
                    currentPhoto = photoSlides.length - 1;
                }

                showPhoto(currentPhoto);
            }

            // スワイプ後は3秒待ってから自動スライド
            startAutoSlide();
        });
    }
</script>
