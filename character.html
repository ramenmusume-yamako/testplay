    <link rel="stylesheet" href="character.css">
    <link rel="stylesheet" href="debug-button.css">
</head>
<header>
    <div class="hamburger-menu">
        <input type="checkbox" id="menu-btn-check">
        <label for="menu-btn-check" class="menu-btn">
          <img src="rogo.png" alt="メニュー">
        </label>
        <div class="menu-content">
            <ul>
                <li><a href="index.html">ホーム</a></li>
                <li><a href="character.html">キャラ紹介</a></li>
                <li><a href="game.html">ミニゲーム</a></li>
                <li><a href="news.html">お知らせ</a></li>
            </ul>
        </div>
    </div>
</header>
<body class="chara-page-theme">
    <a id="debug-spana-btn" href="debug.html" aria-label="デバッグページへ">
    <img src="spana.png" alt="">
</a>

    <div class="chara-window">
        <h1 class="page-title">本日のおすすめ（娘選択）</h1>

        <input type="radio" name="chara-slider" id="chara1" checked>
        <input type="radio" name="chara-slider" id="chara2">

        <div class="chara-rail">
            
            <div class="chara-card">
                <a href="meana.html" class="card-link">
                    <div class="card-img-wrap">
                        <img src="仮.png" alt="醤油くるみ">
                    </div>
                    <div class="card-info">
                        <span class="card-sub">NO.1 ／ 醤油 極太ちぢれ麺</span>
                        <h2>メーナ</h2>
                        <p class="card-tap-tip">クリックでお品書きを見る ➔</p>
                    </div>
                </a>
            </div>
            
        </div>

        <div class="chara-arrows">
            <label for="chara2" class="arrow-btn arrow-left for-c1">＜</label>
            <label for="chara2" class="arrow-btn arrow-right for-c1">＞</label>

            <label for="chara1" class="arrow-btn arrow-left for-c2">＜</label>
            <label for="chara1" class="arrow-right for-c2">＞</label>
        </div>
    </div>
<script src="debug-button.js"></script>
