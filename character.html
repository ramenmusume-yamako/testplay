<!-- PVカウント用スクリプト (Firebase連動) -->
<script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    import {
        getFirestore,
        doc,
        setDoc,
        increment
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


    const firebaseConfig = {
        apiKey: "AIzaSyD5HT-oNq3hFOLSpBqG19Vw7ZmmaEHPzSY",
        authDomain: "ramengirls-bd769.firebaseapp.com",
        projectId: "ramengirls-bd769",
        storageBucket: "ramengirls-bd769.firebasestorage.app",
        messagingSenderId: "211447953783",
        appId: "1:211447953783:web:3d3ee33f78e0d830f48972"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    /* =========================================================
       PVカウント
       ========================================================= */

    (async function trackPV() {

        // 同じタブでは1回だけカウント
        if (!sessionStorage.getItem('visited_session')) {

            const today =
                new Date().toISOString().split('T')[0];

            const pvRef = doc(db, "pv", today);


            try {

                await setDoc(
                    pvRef,
                    { count: increment(1) },
                    { merge: true }
                );

                sessionStorage.setItem(
                    'visited_session',
                    'true'
                );

            } catch (e) {

                console.error(
                    "PVカウントエラー:",
                    e
                );

            }
        }

    })();

</script>


<script>

    /* =========================================================
       キャラクターデータ
       ========================================================= */

    const CHAR_DATA = [

        {
            id: "meana",
            name: "メーナ",
            img: "meana up.png",
            link: "meana.html"
        },

    ];


    /* =========================================================
       キャラクター一覧を生成
       ========================================================= */

    function renderGrid() {

        const container =
            document.getElementById("gridContainer");

        if (!container) return;


        // 一度中身を空にする
        container.innerHTML = "";


        // 8マス作る
        for (let i = 0; i < 8; i++) {

            const card =
                document.createElement("a");


            /* -------------------------------------------------
               キャラクターが登録されている場合
               ------------------------------------------------- */

            if (i < CHAR_DATA.length) {

                const char =
                    CHAR_DATA[i];


                card.className =
                    "chara-grid-card unlocked";

                card.href =
                    char.link;


                card.innerHTML = `

                    <div class="avatar-crop">
                        <img
                            src="${char.img}"
                            alt="${char.name}"
                        >
                    </div>

                    <div class="chara-grid-name">
                        ${char.name}
                    </div>

                    <div class="chara-grid-sub">
                        お品書きを見る ➔
                    </div>

                `;


            /* -------------------------------------------------
               キャラクターがまだ登録されていない場合
               ------------------------------------------------- */

            } else {

                card.className =
                    "chara-grid-card locked";


                card.innerHTML = `

                    <div class="avatar-crop">
                        <img
                            src="shignon.png"
                            alt="準備中"
                        >
                    </div>

                    <div
                        class="chara-grid-name"
                    >
                        ????
                    </div>

                    <div
                        class="chara-grid-sub"
                    >
                        準備中
                    </div>

                `;

            }


            container.appendChild(card);

        }

    }


    /* キャラクター一覧を表示 */
    renderGrid();

</script>
